# TC-ViTok Base Configuration
# Default hyperparameters — ALIGNED WITH PAPER (paperv4.tex)
# Masking method: Index-gather (Option B) — real FLOP savings

# Model architecture
model:
  # Token budget (number of tokens to select from 576 total)
  k: 144  # {72, 144, 216, 288, 576}

  # Tokenization Policy Network (TPN) — paper Section 5.3
  tpn:
    n_heads: 4        # Paper specifies 4 heads (NOT 8)
    d_model: 384      # Shared attention dimension
    d_coarse: 384     # DINOv2-S feature dimension
    d_h: 512          # Score MLP hidden dimension
    d_text: 512       # CLIP text embedding dimension
    M: 49             # Coarse spatial tokens (7×7)
    N: 576            # Full resolution tokens (24×24)

  # LoRA configuration for LLaVA backbone
  lora:
    rank: 32
    alpha: 64
    targets: ["q_proj", "k_proj", "v_proj", "o_proj"]
    dropout: 0.05

# Training dynamics — paper Section 7
training:
  # Gumbel-Sigmoid temperature schedule (paper Eq. 13)
  # Paper: τ annealed linearly from 1.0 to 0.1
  tau_max: 1.0
  tau_min: 0.1

  # Sparsity regularization schedule (paper Eq. 14)
  # Paper: λ_max = 0.1, linear warmup
  lambda_max: 0.1
  T_warmup: 5000  # steps for lambda warmup

  # Entropy regularization (paper: |μ| = 0.01)
  lambda_entropy: 0.01


  # Optimization — paper Section 7.3
  batch_size: 16
  grad_accum_steps: 4  # effective batch size = 64
  max_steps: 50000
  warmup_steps: 1000

  # Learning rates (per-group) — paper Section 7.3
  # Paper: η_TPN = 1e-3, η_LoRA = 2e-4, η_MLP = 5e-4
  lr_tpn: 1e-3
  lr_lora: 2e-4
  lr_mlp: 5e-4
  weight_decay: 0.01

  # Gradient clipping
  max_grad_norm: 1.0

# Data
data:
  image_size_coarse: 98   # DINOv2-S input
  image_size_full: 336    # CLIP ViT-L/14 input
  num_workers: 4
  pin_memory: true

  # Dataset selection: "vqav2" or "gqa"
  dataset: "vqav2"
  max_samples: null  # null = use full dataset; set an int to subsample

  # VQAv2 annotation / image paths — fill in before real training
  # Download: https://visualqa.org/download.html
  train_annotations: "data/vqav2/v2_mscoco_train2014_annotations.json"
  train_questions: "data/vqav2/v2_OpenEnded_mscoco_train2014_questions.json"
  train_image_dir: "data/vqav2/train2014"
  val_annotations: "data/vqav2/v2_mscoco_val2014_annotations.json"
  val_questions: "data/vqav2/v2_OpenEnded_mscoco_val2014_questions.json"
  val_image_dir: "data/vqav2/val2014"

  # GQA paths (used in Phase 1 joint training)
  # Download: https://cs.stanford.edu/people/dorarad/gqa/download.html
  gqa_train_questions: "data/gqa/train_balanced_questions.json"
  gqa_val_questions: "data/gqa/val_balanced_questions.json"
  gqa_train_image_dir: "data/gqa/images"
  gqa_val_image_dir: "data/gqa/images"

  # Feature caching
  cache_dir: "data/cache"
  use_cached_features: false

# Logging
logging:
  wandb_project: "tc-vitok"
  log_interval: 100
  eval_interval: 1000
  save_interval: 5000
  output_dir: "runs"

# Evaluation
evaluation:
  benchmarks: ["vqav2", "gqa", "textvqa", "pope"]
  token_budgets: [72, 144, 216, 288, 576]
  spatial_eval: true  # Enable spatial specificity stratification

# Reproducibility
seed: 42
deterministic: false
