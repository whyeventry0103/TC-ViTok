# Phase 1.5 v3: End-to-end co-adaptation — no pooler warmup
#
# Root cause of v2_pure failure (diagnosed at step 25k):
#   pooler_warmup_steps=5000 created a co-adaptation shock at step 5k.
#   Pooler saw 640,000 examples (5k steps × batch 128) with FIXED Phase 0 routing,
#   building a static routing→prefix mapping. At step 5001 TPN unfroze,
#   routing shifted, pooler's learned representations became obsolete.
#   Simultaneously LoRA unfroze — it adapted to broken pooler output.
#   The three-way chain (TPN routing → pooler prefix → LoRA mapping) all broke
#   at once. val_vqa spiked 0.42 → 0.51 and never recovered (0.49 at step 25k).
#
#   Key insight: co-adaptation requires continuous co-training.
#   Phased warmup produces a hard phase transition — the longer the freeze,
#   the more the pooler overfits, the larger the shock.
#
# Fixes in v3:
#   1. pooler_warmup_steps: 5000 → 0
#      TPN + pooler + projector train together from step 0.
#      Pooler tracks EVOLVING routing continuously — no overfit to static routing.
#      No phase transition at step 5k.
#
#   2. lora_warmfreeze_steps: 5000 → 3000
#      Back to p1v3's validated value. TPN+pooler co-adapt for 3k steps,
#      THEN LoRA joins from B=0 (zero initial output — smooth entry, no discontinuity).
#      LoRA freeze still gives TPN directional signal before LM can compensate.
#
# Expected training trajectory:
#   Steps 0-3k:  TPN + pooler + mm_projector train together (smooth co-adaptation)
#   Step 3k:     LoRA unfreezes from B=0 — zero discontinuity in LLM output
#   Step 5k val: val_vqa ~0.46-0.50 (worse than v2's 0.4222 due to pooler noise;
#                but should MONOTONICALLY DECLINE from here — no explosion)
#   Step 15k:    target val_vqa < 0.43 (Green threshold)
#   Step 100k:   target val_vqa < 0.3334 (beat Phase 1 v3 baseline)
#
# Load from: Phase 0 v4 checkpoint (same as v1, v2)

defaults:
  - base

phase: 1
description: "Phase 1.5 v3: end-to-end co-adapt, pooler_warmup=0, lora_freeze=3k"

model:
  lora:
    rank: 64
    alpha: 128
    targets: ["q_proj", "k_proj", "v_proj", "o_proj"]
    dropout: 0.05

training:
  max_steps: 100000
  batch_size: 4
  grad_accum_steps: 16    # effective batch = 4 × 16 × 2 GPUs = 128

  lambda_max: 0.0
  T_warmup: 5000
  lambda_entropy: 0.02
  lambda_diversity: 0.1

  lambda_distill: 0.05    # 7% of VQA magnitude — spatial supervision without dominating

  # KEY CHANGE 1: No pooler warmup — TPN+pooler co-adapt from step 0
  pooler_warmup_steps: 0          # was 5000 in v2

  # KEY CHANGE 2: LoRA freeze back to p1v3 validated value
  lora_warmfreeze_steps: 3000     # was 5000 in v2; p1v3 used 3000 and reached 0.33

  # Spatial spread: active 0→60k, linear decay 60k→90k, zero at 90k
  lambda_spread: 0.005
  spread_decay_start: 60000
  spread_decay_end: 90000

  lr_tpn: 3e-3
  lr_lora: 2e-4
  lr_mlp: 5e-4

  # Tau: 1.0→0.1 over 100k steps — full range now used since TPN trains from step 0
  tau_max: 1.0
  tau_min: 0.1

data:
  datasets: ["vqav2", "gqa"]

logging:
  wandb_run_name: "phase1p5_v3_endtoend"
  eval_interval: 5000
  max_val_batches: 100

checkpoint:
  load_from: "runs/phase0_v4/phase0/best.ckpt"
  strict: false
