# Phase 0 v3: TokenScorerV3 warmup with frozen LLaVA.
# Trains only the v3 TPN (per-token MLP + self-attn on CLIP-L features).
# DINOv2 and CLIP-text encoders are NOT loaded — v3 is image-only.

defaults:
  - base

phase: 0
description: "Phase 0 v3: TokenScorerV3 warmup (image-only, CLIP-L direct scoring)"

model:
  k: 144
  tpn_version: "v3"
  tpn:
    d_visual: 1024
    d_h: 256
    n_heads: 4
    dropout: 0.1
    N: 576

  # Adaptive budget OFF in Phase 0 — fixed k=144 to keep warmup simple.
  # Phase 1 turns adaptive_budget on after TPN scoring is stable.
  adaptive_budget: false

training:
  max_steps: 15000
  batch_size: 4
  grad_accum_steps: 8        # effective batch = 32 per GPU (single-GPU Phase 0)

  lambda_max: 0.0
  lambda_entropy: 0.02       # spatial diversity — prevent TPN collapse during warmup
  lambda_diversity: 0.0

  lr_tpn: 1e-3

  tau_max: 1.0
  tau_min: 0.1               # anneal fully — sharp selections give cleaner Phase 1 init

  max_grad_norm: 1.0         # same as Phase 1; 5.0 caused instability
  weight_decay: 0.01
  warmup_steps: 1000
  T_warmup: 3000

data:
  datasets: ["vqav2"]        # VQAv2 only — cleaner single-turn gradient signal for TPN warmup

logging:
  wandb_run_name: "phase0_v3"
  eval_interval: 2000
  max_val_batches: 50
  log_interval: 50
  save_interval: 5000
