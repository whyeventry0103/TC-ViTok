# Phase 2: Domain Transfer — paper Section 7.3, Phase 2
# Fine-tune on TextVQA for OCR-heavy questions (optional).
# λ=0, τ=0.1 fixed.

defaults:
  - base

phase: 2
description: "Domain transfer to TextVQA (paper Phase 2: 1 epoch, optional)"

training:
  max_steps: 10000

  trainable_components:
    - tpn
    - lora
    - vision_projector

  # Paper Phase 2: λ=0, τ=0.1 fixed
  lambda_max: 0.0
  lambda_entropy: 0.01
  T_warmup: 1

  # Lower learning rates for domain transfer
  lr_tpn: 5e-5
  lr_lora: 2e-5
  lr_mlp: 5e-5

  # Paper: τ=0.1 fixed for transfer
  tau_max: 0.1
  tau_min: 0.1

data:
  datasets: ["textvqa"]
  train_samples: null

logging:
  wandb_run_name: "phase2_textvqa_transfer"
  eval_interval: 500

checkpoint:
  load_from: "runs/phase1/best.ckpt"
  strict: false
