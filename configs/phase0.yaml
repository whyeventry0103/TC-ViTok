# Phase 0: TPN Warmup — paper Section 7.3, Phase 0
# Train only TPN with frozen LLaVA backbone.
# Loss: L_VQA only (λ=0, μ=0). Temperature: τ=1.0 (fixed).

defaults:
  - base

phase: 0
description: "TPN warmup with frozen backbone (paper Phase 0: 1 epoch)"

training:
  max_steps: 10000

  # Phase 0 OOM fix: batch_size 16→4, grad_accum 4→16
  # Effective batch = 4 × 16 × 2 GPUs = 128 (unchanged from base.yaml).
  # Removing no_grad from frozen LLM (needed for STE gradient) requires storing
  # full LLM activations for backprop. At batch_size=16 this OOMs; 4 is safe.
  batch_size: 4
  grad_accum_steps: 16

  trainable_components:
    - tpn

  # Phase 0 regularization.
  lambda_max: 0.0        # L1 is meaningless with instance norm (mean|s_N| ≈ 0.798 always)
  # lambda_entropy: increased 0.001 → 0.01 so entropy gradient via mask_ste competes
  # with the weak frozen-LLM VQA signal and forces spatial diversity from the start.
  lambda_entropy: 0.01
  # lambda_diversity: within-batch diversity pushes TPN to produce different selections
  # for different questions even during Phase 0 warmup.
  lambda_diversity: 0.02
  lambda_entropy: 0.001
  T_warmup: 1000

  # Paper Phase 0: τ=1.0 fixed
  tau_max: 1.0
  tau_min: 1.0  # No annealing in Phase 0

  # Paper: η_TPN = 1e-3
  lr_tpn: 1e-3

data:
  train_samples: 100000  # subsample from VQAv2 train
  datasets: ["vqav2"]

logging:
  wandb_run_name: "phase0_tpn_warmup"
  # Validation enabled: tau-independent STE now routes VQA gradient to TPN,
  # so val/vqa_loss is meaningful. Monitor val/entropy to confirm TPN learns
  # query-conditioned selection (entropy > -log(144) = -4.97 means it works).
  eval_interval: 2500
  max_val_batches: 50
