# Phase 1: Joint Fine-tuning — paper Section 7.3, Phase 1
# Train TPN + LoRA + projection MLP together on VQAv2 + GQA.
# Full loss with τ annealing (1.0→0.1) and λ warmup (0→0.1).

defaults:
  - base

phase: 1
description: "Joint finetuning of TPN + LoRA + MLP (paper Phase 1: 3 epochs)"

training:
  max_steps: 50000

  # Phase 1 OOM fix: batch_size 16→4, grad_accum 4→16
  # Effective batch = 4 × 16 × 2 GPUs = 128 (unchanged)
  # Phase 0 fit 16/GPU with TPN only (887K params, no activations stored).
  # Phase 1 trains LoRA (35M params) — activations for all 32 LLM layers
  # must be stored for backprop, using ~30GB/GPU extra.
  batch_size: 4
  grad_accum_steps: 16

  trainable_components:
    - tpn
    - lora
    - vision_projector

  # Phase 1 regularization.
  # lambda_max = 0.0: no sparsity penalty on TPN scores.
  # The L1 sparsity loss crushed scores to 0 even at lambda=0.01; the topk
  # operator already enforces exactly k tokens — no L1 penalty is needed for
  # that. Without lambda, TPN scores are driven purely by VQA gradient (which
  # is the correct objective). The sparsity metric is still logged for monitoring.
  # lambda_entropy = 0.001: light diversity regularizer retained for monitoring.
  lambda_max: 0.0
  T_warmup: 5000
  lambda_entropy: 0.001

  # Per-group learning rates.
  # lr_tpn increased 1e-3 → 3e-3: TPN starts from near-zero Phase 0 scores;
  # higher LR accelerates recovery. LoRA/MLP unchanged (already adapted).
  lr_tpn: 3e-3
  lr_lora: 2e-4
  lr_mlp: 5e-4

  # Paper: τ annealed 1.0 → 0.1 over training
  tau_max: 1.0
  tau_min: 0.1

data:
  datasets: ["vqav2", "gqa"]
  train_samples: null  # use full dataset

logging:
  wandb_run_name: "phase1_joint_finetune"
  eval_interval: 5000
  max_val_batches: 100  # limit val to ~100 batches (~55s) instead of full 13K batches (~2h)

checkpoint:
  load_from: "runs/phase0/best.ckpt"
  strict: false
