# Phase 1: Joint Finetuning
# Train TPN + LoRA + projection MLP together on full VQAv2 + GQA

# Inherit from base config
defaults:
  - base

# Override for Phase 1
phase: 1
description: "Joint finetuning of TPN + LoRA + MLP"

training:
  max_steps: 50000

  # Train TPN, LoRA, and projection MLP
  trainable_components:
    - tpn
    - lora
    - vision_projector

  # Standard regularization
  lambda_max: 0.01
  T_warmup: 5000

  # Balanced learning rates
  lr_tpn: 1e-4
  lr_lora: 5e-5
  lr_mlp: 1e-4

  # Standard temperature schedule
  tau_max: 5.0
  tau_min: 0.5

data:
  # Full training datasets
  datasets: ["vqav2", "gqa"]
  train_samples: null  # use full dataset

logging:
  wandb_run_name: "phase1_joint_finetune"
  eval_interval: 1000

# Load Phase 0 checkpoint
checkpoint:
  load_from: "runs/phase0/best.ckpt"
  strict: false  # Allow loading subset of weights
